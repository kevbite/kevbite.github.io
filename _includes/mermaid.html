<!-- Renders ```mermaid code blocks as diagrams. Mermaid is only downloaded on pages that have one. -->
<script type="module">
  const blocks = document.querySelectorAll('code.language-mermaid, div.language-mermaid code');
  if (blocks.length > 0) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs');

    // Kramdown turns ```mermaid into an ordinary code block (<pre><code>, wrapped in a
    // div if Rouge highlights it), so swap each one for the element Mermaid renders into.
    blocks.forEach(code => {
      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = code.textContent;
      (code.closest('div.highlighter-rouge') ?? code.closest('pre') ?? code).replaceWith(diagram);
    });

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      fontFamily: "'Lato', sans-serif",
      gantt: {
        fontSize: 14,
        sectionFontSize: 14,
        barHeight: 26,
        barGap: 8,
        leftPadding: 130,
        rightPadding: 20,
        gridLineStartPadding: 30,
      },
      themeVariables: {
        fontFamily: "'Lato', sans-serif",
        fontSize: '15px',
        primaryColor: '#e8eef4',
        primaryBorderColor: '#263959',
        primaryTextColor: '#333030',
        lineColor: '#a0a0a0',
        textColor: '#515151',
        // Gantt charts
        sectionBkgColor: '#fafafa',
        altSectionBkgColor: '#ffffff',
        sectionBkgColor2: '#fafafa',
        gridColor: '#ecf0f1',
        taskBkgColor: '#8fb8ef',
        taskBorderColor: '#263959',
        taskTextColor: '#263959',
        taskTextLightColor: '#263959',
        taskTextDarkColor: '#263959',
        taskTextOutsideColor: '#333030',
        activeTaskBkgColor: '#8fb8ef',
        activeTaskBorderColor: '#263959',
        doneTaskBkgColor: '#ecf0f1',
        doneTaskBorderColor: '#a0a0a0',
        critBkgColor: '#94cf70',
        critBorderColor: '#4f8a2c',
      },
    });

    await mermaid.run({ querySelector: 'div.mermaid' });
  }
</script>
